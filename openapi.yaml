openapi: 3.1.0
info:
  title: Fork & Flame API
  version: 1.0.0
  summary: Fictitious API spec for the Fork & Flame backend.
  description: |
    FICTITIOUS. Written from the docs in `docs/`, not from running code.

    Versions live in the path (`/v1`). Money is integer cents. Every failure uses
    the error envelope below; `error.code` is a stable string. Rate limits apply
    per client IP and per API key.
  x-fictitious: true
servers:
  - url: https://api.forkflame.example/v1
    description: Fictitious production gateway
  - url: http://localhost:8080/v1
    description: Local gateway
tags:
  - name: Health
  - name: Menu
  - name: Orders
  - name: Auth
  - name: Kitchen
    description: Kitchen role only.
  - name: Manager
    description: Manager role only.

security:
  - {}
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Gateway health
      security: []
      servers:
        - url: http://localhost:8080
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /menu:
    get:
      tags: [Menu]
      summary: List orderable dishes
      description: "Rendered menu, cached 60 seconds. Sold-out dishes are included with `available: false`."
      operationId: listMenu
      parameters:
        - name: course
          in: query
          schema:
            type: string
            enum: [starter, main, dessert, drink]
      responses:
        "200":
          description: Menu
          headers:
            Cache-Control:
              schema: { type: string, example: "max-age=60" }
          content:
            application/json:
              schema:
                type: object
                required: [dishes]
                properties:
                  dishes:
                    type: array
                    items: { $ref: "#/components/schemas/Dish" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /menu/search:
    get:
      tags: [Menu]
      summary: Search dishes
      description: Postgres full-text search. Only orderable dishes rank. Typos within two edits match.
      operationId: searchMenu
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          example: margerita
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Dish" }
                  suggestion:
                    description: Closest course when there are no results.
                    type: [string, "null"]
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /dishes/{dishId}:
    get:
      tags: [Menu]
      summary: Get one dish
      operationId: getDish
      parameters:
        - $ref: "#/components/parameters/DishId"
      responses:
        "200":
          description: Dish
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dish" }
        "404": { $ref: "#/components/responses/Error" }

  /orders:
    post:
      tags: [Orders]
      summary: Create order
      description: |
        Creates an order in state `received`, reserves stock and authorizes the
        exact total. Replaying the same `Idempotency-Key` returns the existing
        order (`200`) instead of creating a second one. Limit: 20 per minute.
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: Replay of an existing order with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Error" }
        "402":
          description: Payment authorization declined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: A dish is sold out or stock changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /orders/{orderNumber}:
    get:
      tags: [Orders]
      summary: Track order
      description: "Guests track by order number. Limit: 120 polls per minute."
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Current order state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /orders/{orderNumber}/events:
    get:
      tags: [Orders]
      summary: Order history
      description: Append-only list of state transitions. Explains "why is my pizza still firing".
      operationId: listOrderEvents
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/OrderEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /orders/{orderNumber}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      description: Allowed only before `firing`. Stock is released and payment is voided, or refunded automatically.
      operationId: cancelOrder
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: Order already firing or later
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/login-links:
    post:
      tags: [Auth]
      summary: Request email login link
      description: Passwordless. Always answers `202` so accounts cannot be enumerated.
      operationId: requestLoginLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Accepted }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/sessions:
    post:
      tags: [Auth]
      summary: Exchange login link token for session
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Single-use token from the email link. }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/sessions/current:
    delete:
      tags: [Auth]
      summary: Log out
      operationId: deleteSession
      responses:
        "204": { description: Session deleted }
        "401": { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [Auth]
      summary: Current customer
      operationId: getMe
      responses:
        "200":
          description: Customer profile and Ember balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Error" }

  /kitchen/dishes/{dishId}/availability:
    put:
      tags: [Kitchen]
      summary: Set dish availability
      description: Change reaches the storefront within 5 seconds via cache invalidation.
      operationId: setDishAvailability
      parameters:
        - $ref: "#/components/parameters/DishId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        "200":
          description: Updated dish
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dish" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /kitchen/orders/{orderNumber}/fire:
    post:
      tags: [Kitchen]
      summary: Accept order and fire
      description: Requires captured payment or cash flag. Captures the authorization.
      operationId: fireOrder
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Order now `firing`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /manager/orders/{orderNumber}/refunds:
    post:
      tags: [Manager]
      summary: Refund order after firing
      description: Lands within 5 business days. Before `firing`, refunds are automatic on cancel.
      operationId: refundOrder
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents, reason]
              properties:
                amount_cents: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Refund requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

webhooks:
  order.ready:
    post:
      summary: Dish leaves the oven
      operationId: orderReadyWebhook
      description: At-least-once delivery. Dedupe by `id`. Signed with HMAC-SHA256 over the raw body.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Acknowledged }
  order.picked_up:
    post:
      summary: Courier takes the bag
      operationId: orderPickedUpWebhook
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Acknowledged }
  order.delivered:
    post:
      summary: Customer confirms delivery
      operationId: orderDeliveredWebhook
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Acknowledged }
  order.cancelled:
    post:
      summary: Cancelled before firing
      operationId: orderCancelledWebhook
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "2XX": { description: Acknowledged }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque 256-bit session token. Kitchen and manager sessions last 12 hours; customer sessions slide over 30 days.

  parameters:
    DishId:
      name: dishId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z0-9]{8}$", example: "K7Q2M9XB" }
    WebhookSignature:
      name: X-FF-Signature
      in: header
      required: true
      description: "`sha256=` + hex HMAC-SHA256 of the raw body."
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Seconds until the budget refills.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again shortly.
              retryable: true

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              description: Stable machine-readable code. Never renamed.
              examples: [dish_sold_out, rate_limited]
            message:
              type: string
              description: Safe to display to customers.
            retryable:
              type: boolean
      example:
        error:
          code: dish_sold_out
          message: The octopus just sold out. The menu has the rest.
          retryable: false

    Dish:
      type: object
      required: [id, name, course, price_cents, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Margherita }
        course: { type: string, enum: [starter, main, dessert, drink] }
        price_cents: { type: integer, minimum: 0, example: 1450 }
        available: { type: boolean }
        diet: { type: array, items: { type: string, enum: [vegetarian, vegan, gluten_free] } }
        ingredients: { type: array, items: { type: string } }

    CreateOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dish_id, quantity]
            properties:
              dish_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 50 }
              extras: { type: array, items: { type: string } }
        payment:
          description: Omit for cash orders.
          oneOf:
            - type: object
              required: [type, token]
              properties:
                type: { const: card }
                token: { type: string, description: Provider token. Card numbers never reach this API. }
            - type: object
              required: [type]
              properties:
                type: { const: cash }
        ember_redeem_cents: { type: integer, minimum: 0, default: 0 }

    Order:
      type: object
      required: [order_number, state, total_cents, created_at]
      properties:
        order_number: { type: string, example: K7Q2M9XB }
        state:
          type: string
          enum: [received, firing, ready, picked_up, delivered, cancelled, failed]
        subtotal_cents: { type: integer, minimum: 0 }
        fee_cents: { type: integer, minimum: 0 }
        discount_cents: { type: integer, minimum: 0 }
        total_cents: { type: integer, minimum: 0 }
        lines:
          type: array
          items:
            type: object
            properties:
              dish_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              unit_price_cents: { type: integer }
        created_at: { type: string, format: date-time }
        ready_at: { type: [string, "null"], format: date-time }
        picked_up_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }

    OrderEvent:
      type: object
      required: [state, at]
      properties:
        state:
          type: string
          enum: [received, firing, ready, picked_up, delivered, cancelled, failed]
        at: { type: string, format: date-time }
        note: { type: [string, "null"] }

    Session:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, description: Opaque 256-bit token. Shown once. }
        expires_at: { type: string, format: date-time }
        role: { type: string, enum: [customer, kitchen, manager] }

    Customer:
      type: object
      required: [id, email, ember_balance]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        ember_balance: { type: integer, minimum: 0, description: Loyalty points. }

    Refund:
      type: object
      required: [id, order_number, amount_cents, status]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        amount_cents: { type: integer, minimum: 1 }
        status: { type: string, enum: [requested, settled, failed] }

    WebhookEvent:
      type: object
      required: [id, type, occurred_at, data]
      properties:
        id: { type: string, format: uuid, description: Dedupe key. }
        type:
          type: string
          enum: [order.ready, order.picked_up, order.delivered, order.cancelled]
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          properties:
            order_id: { type: string, format: uuid }
            ready_at: { type: string, format: date-time }
            courier_id: { type: string }
            delivered_at: { type: string, format: date-time }
            reason: { type: string }
